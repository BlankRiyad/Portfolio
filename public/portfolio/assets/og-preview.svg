<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF8F3"/>
      <stop offset="1" stop-color="#F5EDE3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4A484"/>
      <stop offset="1" stop-color="#A88B6A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C4A484" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C4A484" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft glow blobs -->
  <circle cx="980" cy="120" r="180" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="180" cy="540" r="160" fill="url(#glow)" filter="url(#soft)"/>

  <!-- Left accent bar -->
  <rect x="80" y="240" width="6" height="150" rx="3" fill="url(#accent)"/>

  <!-- Emblem (palm-tree inspired, simplified) -->
  <g transform="translate(960, 315)" stroke="#C4A484" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="78" stroke-width="2.5" opacity="0.35"/>
    <!-- trunk -->
    <path d="M0,70 L0,-10" stroke-width="6"/>
    <!-- fronds -->
    <path d="M0,-10 Q-40,-40 -70,-30"/>
    <path d="M0,-10 Q40,-40 70,-30"/>
    <path d="M0,-10 Q-30,-55 -50,-65"/>
    <path d="M0,-10 Q30,-55 50,-65"/>
    <path d="M0,-10 Q-10,-70 0,-85"/>
    <path d="M0,-10 Q10,-70 0,-85"/>
    <!-- trunk texture -->
    <path d="M-4,30 L4,30" stroke-width="2.5"/>
    <path d="M-4,10 L4,10" stroke-width="2.5"/>
    <path d="M-4,-10 L4,-10" stroke-width="2.5"/>
  </g>

  <!-- Eyebrow -->
  <text x="120" y="250" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#A88B6A">PORTFOLIO</text>

  <!-- Name -->
  <text x="120" y="340" font-family="Georgia, serif" font-size="78" font-weight="700" fill="#3D3229">MD. RIYAD HASAN</text>

  <!-- Title -->
  <text x="122" y="395" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#A88B6A">Political Studies Graduate  |  Public Administration Enthusiast</text>

  <!-- Tagline -->
  <text x="122" y="445" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#6B5E54">Leadership · Research · Public Administration · Digital Skills</text>

  <!-- Bottom accent line -->
  <rect x="80" y="540" width="1040" height="2" fill="#EDE4D8"/>
  <text x="80" y="575" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#6B5E54">SUST · Sylhet, Bangladesh</text>
  <text x="1120" y="575" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#A88B6A" text-anchor="end">mdriyad83@student.sust.edu</text>
</svg>
